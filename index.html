<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULUMED Video Konferans</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 10px;
        }

        .header {
            text-align: center;
            padding: 15px;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .join-form {
            background: rgba(30, 41, 59, 0.8);
            padding: 20px;
            border-radius: 12px;
            max-width: 400px;
            margin: 40px auto;
            text-align: center;
        }

        .join-form input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #3b82f6;
            border-radius: 8px;
            background: #1e293b;
            color: #f8fafc;
            font-size: 16px;
        }

        .join-form button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .video-container {
            display: none;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            margin-bottom: 100px;
        }

        .video-container.active {
            display: grid;
        }

        .video-box {
            background: #000;
            border: 2px solid #334155;
            border-radius: 8px;
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .video-box video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .video-box .label {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.6);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 10;
        }

        .controls {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.95);
            padding: 15px;
            justify-content: center;
            gap: 10px;
            z-index: 1000;
            border-top: 1px solid #334155;
        }

        .controls button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            min-width: 80px;
        }

        .btn-mute { background: #22c55e; }
        .btn-mute.off { background: #ef4444; }
        .btn-camera { background: #3b82f6; }
        .btn-camera.off { background: #ef4444; }
        .btn-leave { background: #ef4444; }

        @media (max-width: 1024px) {
            .video-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .video-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
                padding: 5px;
            }
            .video-box {
                aspect-ratio: 16 / 9;
            }
            .controls button {
                flex: 1;
                font-size: 12px;
                padding: 10px 5px;
            }
        }

        @media (max-width: 480px) {
            .video-container {
                grid-template-columns: 1fr;
            }
        }

        .status-log {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #4ade80;
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 10px;
            max-width: 200px;
            z-index: 2000;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="joinForm" class="join-form">
            <h2 style="margin-bottom: 20px;">ULUMED Video</h2>
            <input type="text" id="username" placeholder="Adınız" />
            <input type="text" id="roomCode" placeholder="Oda Kodu" />
            <button onclick="joinRoom()">Katıl</button>
        </div>

        <div id="videoContainer" class="video-container">
            <div class="video-box" id="localVideoBox">
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="label">Ben</div>
            </div>
        </div>

        <div id="controls" class="controls">
            <button class="btn-mute" id="muteBtn" onclick="toggleMute()">🎤 Ses</button>
            <button class="btn-camera" id="camBtn" onclick="toggleCamera()">📷 Kamera</button>
            <button class="btn-leave" onclick="leaveRoom()">🚪 Ayrıl</button>
        </div>

        <div id="statusLog" class="status-log">Sistem Hazır...</div>
    </div>

    <script>
        let localStream;
        let peerConnections = {};
        let ws;
        let username;
        let roomCode;
        let isMuted = false;
        let isCameraOff = false;
        let iceCandidatesQueue = {};

        const config = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        function log(msg) {
            console.log(msg);
            const logEl = document.getElementById('statusLog');
            logEl.innerText = msg;
        }

        async function joinRoom() {
            username = document.getElementById('username').value.trim();
            roomCode = document.getElementById('roomCode').value.trim();

            if (!username || !roomCode) return alert('Lütfen bilgileri girin');

            try {
                log("Medya erişimi isteniyor...");
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
                
                document.getElementById('joinForm').style.display = 'none';
                document.getElementById('videoContainer').classList.add('active');
                document.getElementById('controls').style.display = 'flex';

                connectWebSocket();
            } catch (err) {
                log("Hata: " + err.message);
                alert("Kamera/Mikrofon izni gerekli!");
            }
        }

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const url = `${protocol}//${window.location.host}/ws/${roomCode}?uye_adi=${encodeURIComponent(username)}`;
            log("Sunucuya bağlanılıyor...");
            
            ws = new WebSocket(url);

            ws.onopen = () => {
                log("Bağlantı kuruldu.");
                ws.send(JSON.stringify({ tip: 'join', kullanici_adi: username }));
            };

            ws.onmessage = async (event) => {
                const data = JSON.parse(event.data);
                log("Mesaj: " + data.tip);

                switch(data.tip) {
                    case 'user-joined':
                        log("Yeni kullanıcı: " + data.kullanici_id);
                        await createPeerConnection(data.kullanici_id, true);
                        break;
                    case 'offer':
                        await handleOffer(data);
                        break;
                    case 'answer':
                        await handleAnswer(data);
                        break;
                    case 'ice-candidate':
                        await handleIceCandidate(data);
                        break;
                    case 'user-left':
                        log("Kullanıcı ayrıldı: " + data.kullanici_id);
                        removeRemoteVideo(data.kullanici_id);
                        break;
                }
            };

            ws.onclose = () => log("Bağlantı kesildi!");
        }

        async function createPeerConnection(targetId, isOfferer) {
            if (peerConnections[targetId]) return peerConnections[targetId];

            log("Bağlantı kuruluyor: " + targetId);
            const pc = new RTCPeerConnection(config);
            peerConnections[targetId] = pc;

            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    ws.send(JSON.stringify({
                        tip: 'ice-candidate',
                        hedef: targetId,
                        candidate: event.candidate
                    }));
                }
            };

            pc.ontrack = (event) => {
                log("Görüntü alındı: " + targetId);
                showRemoteVideo(targetId, event.streams[0]);
            };

            if (isOfferer) {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                ws.send(JSON.stringify({ tip: 'offer', hedef: targetId, offer: offer }));
            }

            return pc;
        }

        async function handleOffer(data) {
            const pc = await createPeerConnection(data.gonderen, false);
            await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
            
            const queue = iceCandidatesQueue[data.gonderen] || [];
            for (const cand of queue) await pc.addIceCandidate(new RTCIceCandidate(cand));
            delete iceCandidatesQueue[data.gonderen];

            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            ws.send(JSON.stringify({ tip: 'answer', hedef: data.gonderen, answer: answer }));
        }

        async function handleAnswer(data) {
            const pc = peerConnections[data.gonderen];
            if (pc) await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
        }

        async function handleIceCandidate(data) {
            const pc = peerConnections[data.gonderen];
            if (pc && pc.remoteDescription) {
                await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            } else {
                if (!iceCandidatesQueue[data.gonderen]) iceCandidatesQueue[data.gonderen] = [];
                iceCandidatesQueue[data.gonderen].push(data.candidate);
            }
        }

        function showRemoteVideo(userId, stream) {
            let box = document.getElementById('remote-' + userId);
            if (!box) {
                box = document.createElement('div');
                box.className = 'video-box';
                box.id = 'remote-' + userId;
                box.innerHTML = `<video autoplay playsinline></video><div class="label">${userId}</div>`;
                document.getElementById('videoContainer').appendChild(box);
            }
            const video = box.querySelector('video');
            if (video.srcObject !== stream) video.srcObject = stream;
        }

        function removeRemoteVideo(userId) {
            const box = document.getElementById('remote-' + userId);
            if (box) box.remove();
            if (peerConnections[userId]) {
                peerConnections[userId].close();
                delete peerConnections[userId];
            }
        }

        function toggleMute() {
            isMuted = !isMuted;
            localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
            document.getElementById('muteBtn').classList.toggle('off', isMuted);
            document.getElementById('muteBtn').innerText = isMuted ? "🔇 Kapalı" : "🎤 Ses";
        }

        function toggleCamera() {
            isCameraOff = !isCameraOff;
            localStream.getVideoTracks().forEach(t => t.enabled = !isCameraOff);
            document.getElementById('camBtn').classList.toggle('off', isCameraOff);
            document.getElementById('camBtn').innerText = isCameraOff ? "📵 Kapalı" : "📷 Kamera";
        }

        function leaveRoom() {
            location.reload();
        }
    </script>
</body>
</html>
