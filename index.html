<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULUMED Video Konferans</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #f8fafc;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 20px;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #3b82f6;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .join-form {
            background: rgba(30, 41, 59, 0.8);
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            margin: 50px auto;
            text-align: center;
        }

        .join-form input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #3b82f6;
            border-radius: 8px;
            background: #1e293b;
            color: #f8fafc;
            font-size: 16px;
        }

        .join-form button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .join-form button:hover {
            background: #2563eb;
        }

        .video-container {
            display: none;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        #remoteVideos {
            display: contents;
        }

        .video-box {
            background: rgba(30, 41, 59, 0.8);
            border-radius: 12px;
            padding: 15px;
            position: relative;
        }

        .video-box video {
            width: 100%;
            border-radius: 8px;
            background: #0f172a;
        }

        .video-box .label {
            position: absolute;
            bottom: 25px;
            left: 25px;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        .controls {
            display: none;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .controls button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-mute {
            background: #22c55e;
            color: white;
        }

        .btn-mute.off {
            background: #ef4444;
        }

        .btn-camera {
            background: #3b82f6;
            color: white;
        }

        .btn-camera.off {
            background: #ef4444;
        }

        .btn-share {
            background: #8b5cf6;
            color: white;
        }

        .btn-leave {
            background: #ef4444;
            color: white;
        }

        .btn-leave:hover {
            background: #dc2626;
        }

        .participants {
            display: none;
            background: rgba(30, 41, 59, 0.8);
            padding: 20px;
            border-radius: 12px;
        }

        .participants h3 {
            margin-bottom: 15px;
            color: #3b82f6;
        }

        .participants ul {
            list-style: none;
        }

        .participants li {
            padding: 8px 0;
            border-bottom: 1px solid #334155;
        }

        .error {
            background: #ef4444;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 20px auto;
            max-width: 500px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ULUMED Video Konferans</h1>
            <p>Güvenli ve kolay görüntülü görüşme platformu</p>
        </div>

        <div id="error" class="error"></div>

        <div id="joinForm" class="join-form">
            <h2>Görüşmeye Katıl</h2>
            <input type="text" id="username" placeholder="Adınız Soyadınız" />
            <input type="text" id="roomCode" placeholder="Oda Kodu" />
            <button onclick="joinRoom()">Katıl</button>
        </div>

        <div id="videoContainer" class="video-container">
            <div class="video-box">
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="label">Ben</div>
            </div>
            <div id="remoteVideos"></div>
        </div>

        <div id="controls" class="controls">
            <button class="btn-mute" onclick="toggleMute()">🎤 Mikrofon</button>
            <button class="btn-camera" onclick="toggleCamera()">📷 Kamera</button>
            <button class="btn-share" onclick="shareScreen()">🖥️ Ekran Paylaş</button>
            <button class="btn-leave" onclick="leaveRoom()">🚪 Ayrıl</button>
        </div>

        <div id="participants" class="participants">
            <h3>Katılımcılar</h3>
            <ul id="participantList"></ul>
        </div>
    </div>

    <script>
        let localStream;
        let peerConnections = {};
        let ws;
        let username;
        let roomCode;
        let isMuted = false;
        let isCameraOff = false;
        let bekleyenIceAdaylari = {};

        const config = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        window.onload = function() {
            const odaParam = getQueryParam('oda');
            const adParam = getQueryParam('ad');
            if (odaParam) {
                document.getElementById('roomCode').value = odaParam;
            }
            if (adParam) {
                document.getElementById('username').value = decodeURIComponent(adParam);
            }
        };

        async function joinRoom() {
            username = document.getElementById('username').value.trim();
            roomCode = document.getElementById('roomCode').value.trim();

            if (!username || !roomCode) {
                showError('Lütfen adınızı ve oda kodunu girin');
                return;
            }

            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true
                });

                document.getElementById('localVideo').srcObject = localStream;
                document.getElementById('joinForm').style.display = 'none';
                document.getElementById('videoContainer').style.display = 'grid';
                document.getElementById('controls').style.display = 'flex';
                document.getElementById('participants').style.display = 'block';

                connectWebSocket();
            } catch (err) {
                showError('Kamera/mikrofon erişimi reddedildi: ' + err.message);
            }
        }

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/${roomCode}?uye_adi=${encodeURIComponent(username)}`);

            ws.onopen = function() {
                ws.send(JSON.stringify({
                    tip: 'join',
                    kullanici_adi: username
                }));
            };

            ws.onmessage = async function(event) {
                const data = JSON.parse(event.data);

                switch(data.tip) {
                    case 'offer':
                        await handleOffer(data);
                        break;
                    case 'answer':
                        await handleAnswer(data);
                        break;
                    case 'ice-candidate':
                        await handleIceCandidate(data);
                        break;
                    case 'kullanici_listesi':
                        updateParticipantList(data.kullanicilar);
                        break;
                    case 'user-joined':
                        await createPeerConnection(data.kullanici_id, true);
                        break;
                }
            };

            ws.onclose = function() {
                showError('Bağlantı kesildi');
            };

            ws.onerror = function(err) {
                showError('WebSocket hatası');
            };
        }

        // Her katılımcı için tek bir RTCPeerConnection oluşturur.
        // teklifGonder=true ise (odaya yeni biri girdiğinde) karşı tarafa offer gönderilir.
        async function createPeerConnection(targetUserId, teklifGonder) {
            if (peerConnections[targetUserId]) {
                return peerConnections[targetUserId];
            }

            const pc = new RTCPeerConnection(config);

            localStream.getTracks().forEach(track => {
                pc.addTrack(track, localStream);
            });

            pc.onicecandidate = function(event) {
                if (event.candidate) {
                    ws.send(JSON.stringify({
                        tip: 'ice-candidate',
                        hedef: targetUserId,
                        candidate: event.candidate
                    }));
                }
            };

            pc.ontrack = function(event) {
                uzakGoruntuyuGoster(targetUserId, event.streams[0]);
            };

            pc.onconnectionstatechange = function() {
                if (['failed', 'closed', 'disconnected'].includes(pc.connectionState)) {
                    uzakGoruntuyuKaldir(targetUserId);
                    delete peerConnections[targetUserId];
                }
            };

            peerConnections[targetUserId] = pc;

            if (teklifGonder) {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                ws.send(JSON.stringify({
                    tip: 'offer',
                    hedef: targetUserId,
                    offer: offer
                }));
            }

            return pc;
        }

        function uzakGoruntuyuGoster(userId, stream) {
            const boxId = 'remote-' + userId;
            let box = document.getElementById(boxId);

            if (!box) {
                box = document.createElement('div');
                box.className = 'video-box';
                box.id = boxId;

                const label = document.createElement('div');
                label.className = 'label';
                label.textContent = userId;

                const video = document.createElement('video');
                video.autoplay = true;
                video.playsInline = true;

                box.appendChild(video);
                box.appendChild(label);
                document.getElementById('remoteVideos').appendChild(box);
            }

            const video = box.querySelector('video');
            if (video.srcObject !== stream) {
                video.srcObject = stream;
                video.play().catch(() => {});
            }
        }

        function uzakGoruntuyuKaldir(userId) {
            const box = document.getElementById('remote-' + userId);
            if (box) {
                box.remove();
            }
            delete bekleyenIceAdaylari[userId];
        }

        async function handleOffer(data) {
            if (!data.gonderen) {
                return;
            }

            const pc = await createPeerConnection(data.gonderen, false);

            await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
            await bekleyenAdaylariIsle(data.gonderen);

            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            ws.send(JSON.stringify({
                tip: 'answer',
                hedef: data.gonderen,
                answer: answer
            }));
        }

        async function handleAnswer(data) {
            const pc = peerConnections[data.gonderen];
            if (pc) {
                await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
                await bekleyenAdaylariIsle(data.gonderen);
            }
        }

        async function handleIceCandidate(data) {
            if (!data.gonderen) {
                return;
            }

            const pc = peerConnections[data.gonderen];

            // Uzak açıklama henüz ayarlanmadıysa adayı kuyruğa al, sonra işlenir
            if (!pc || !pc.remoteDescription || !pc.remoteDescription.type) {
                if (!bekleyenIceAdaylari[data.gonderen]) {
                    bekleyenIceAdaylari[data.gonderen] = [];
                }
                bekleyenIceAdaylari[data.gonderen].push(data.candidate);
                return;
            }

            await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
        }

        async function bekleyenAdaylariIsle(userId) {
            const pc = peerConnections[userId];
            const adaylar = bekleyenIceAdaylari[userId] || [];
            delete bekleyenIceAdaylari[userId];

            for (const aday of adaylar) {
                try {
                    await pc.addIceCandidate(new RTCIceCandidate(aday));
                } catch (err) {
                    console.error('ICE adayı eklenemedi:', err);
                }
            }
        }

        function updateParticipantList(participants) {
            const list = document.getElementById('participantList');
            list.innerHTML = '';
            participants.forEach(p => {
                const li = document.createElement('li');
                li.textContent = p;
                list.appendChild(li);
            });
        }

        function toggleMute() {
            isMuted = !isMuted;
            localStream.getAudioTracks().forEach(track => {
                track.enabled = !isMuted;
            });
            document.querySelector('.btn-mute').classList.toggle('off', isMuted);
        }

        function toggleCamera() {
            isCameraOff = !isCameraOff;
            localStream.getVideoTracks().forEach(track => {
                track.enabled = !isCameraOff;
            });
            document.querySelector('.btn-camera').classList.toggle('off', isCameraOff);
        }

        async function shareScreen() {
            try {
                const screenStream = await navigator.mediaDevices.getDisplayMedia({
                    video: true
                });

                const screenTrack = screenStream.getVideoTracks()[0];
                const sender = peerConnections[Object.keys(peerConnections)[0]]?.getSenders().find(
                    s => s.track.kind === 'video'
                );

                if (sender) {
                    sender.replaceTrack(screenTrack);
                }

                screenTrack.onended = function() {
                    location.reload();
                };
            } catch (err) {
                showError('Ekran paylaşımı başarısız: ' + err.message);
            }
        }

        function leaveRoom() {
            if (ws) {
                ws.close();
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            location.reload();
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
